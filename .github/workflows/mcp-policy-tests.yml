name: MCP Policy Tests

on:
  pull_request:
    paths:
      - "crates/agentgateway/**"
      - ".github/workflows/mcp-policy-tests.yml"
  workflow_dispatch:

jobs:
  mcp-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify npx
        run: npx --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Optional warmup if your test pulls an MCP server via npx:
      - name: Warm MCP package tarball (best-effort)
        run: |
          set -euxo pipefail
          npx -y --yes @modelcontextprotocol/server-memory --help || true

      - name: Build
        run: cargo build --workspace --all-features

      - name: Run MCP policy tests (single thread to avoid port races)
        run: |
          cargo test -p agentgateway \
            --features mcp_integration \
            --test mcp_policies_extauth_ratelimit \
            -- --nocapture --test-threads=1
